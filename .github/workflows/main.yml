name: Kernel Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MemKernel as a module (M-OUT)
        run: |
          curl -LSs "https://raw.githubusercontent.com/Poko-Apps/MemKernel/main/kernel/setup.sh" | bash -s M dogi

      - name: Build Kernel with WeebX-Clang
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-dir: .
          config: vayu_defconfig
          arch: arm64
          aosp-clang: false
          aosp-gcc: false
          other-clang-url: https://github.com/XSans0/WeebX-Clang/releases/download/WeebX-Clang-19.0.0-release/WeebX-Clang-19.0.0.tar.gz
          other-gcc64-url: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9
          other-gcc64-branch: lineage-19.1
          other-gcc32-url: https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9
          other-gcc32-branch: lineage-19.1
          anykernel3: true

      - name: Upload Kernel and Module (Downloadable Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Loganysl-vayu-kernel-and-module
          path: |
            **/arch/arm64/boot/Image*
            **/arch/arm64/boot/dtbo.img
            **/arch/arm64/boot/dts/qcom/*.dtb
            **/dogi.ko
            **/memkernel.ko
            *.zip
          if-no-files-found: warn
